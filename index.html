<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ganjan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322e0d0'/%3E%3Cpath d='M20 18l26 14-26 14z' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Lobster&family=Montserrat:wght@400;700&family=Oswald&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="logo"><span class="logo-mark">▶</span> Ganjan</div>
  <div class="menu-wrap"><button id="menuBtn" class="btn-menu">Menú ▾</button><div id="menu" class="menu hidden"></div></div>
  <div id="saved" class="saved"><i class="dotok">✓</i> Guardado automático</div>
  <input id="projName" class="proj-name" spellcheck="false">
  <div class="spacer"></div>
  <button id="btnExport" class="btn-primary">⬆ Exportar</button>
</header>

<main id="work">
  <section id="lib" class="panel">
    <nav id="libTabs" class="libtabs"></nav>
    <div class="libmain"><aside id="libSide" class="libside"></aside><div class="libcol"><div id="libBody" class="libbody"></div><div id="libFoot" class="libfoot"></div></div></div>
  </section>

  <section id="player" class="panel">
    <div class="panel-title"><span id="playerTitle">Reproductor</span></div>
    <div id="stage"><div id="stageInner"><canvas id="cv" width="960" height="540"></canvas><div id="selbox" class="selbox hidden"><i class="h nw"></i><i class="h ne"></i><i class="h sw"></i><i class="h se" data-h="scale"></i><i class="h rot" data-h="rot"></i></div></div></div>
    <div id="pctl">
      <span id="tCur" class="t-cur">00:00:00:00</span><span class="t-sep">/</span><span id="tTot">00:00:00:00</span>
      <div class="spacer"></div>
      <button id="btnPlay" class="round" title="Reproducir (Espacio)">▶</button>
      <div class="spacer"></div>
      <button id="btnQuality" class="chip" data-pop="1">Alta</button>
      <button id="btnRatio" class="chip" data-pop="1">Relación</button>
      <button id="btnFull" class="icon" title="Pantalla completa">⛶</button>
    </div>
  </section>

  <section id="insp" class="panel">
    <nav id="inspTabs" class="inspTabs"></nav>
    <div id="inspBody" class="inspBody"></div>
  </section>
</main>

<section id="tl">
  <div id="tltools" class="tltools"></div>
  <div id="tlscroll"><div id="tlinner"></div></div>
</section>

<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<input id="fileIn" type="file" accept="video/*,audio/*,image/*" multiple hidden>

<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/grade.js"></script>
<script src="js/engine.js"></script>
<script src="js/core.js"></script>
<script src="js/lib.js"></script>
<script src="js/insp.js"></script>
<script src="js/ui.js"></script>
<script src="js/agent.js"></script>
</body>
</html>
